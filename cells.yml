# Every build cell of the engine packs, the pins of each engine, and the build image.
# scripts/plan.sh turns this file into the matrix of each job of build-packs.yml.
# A cell is one row of that matrix: its keys and value types are the matrix keys of the job.
# scripts/pack.sh passes the pins of the engine and the image to the recipe.
manylinux_image: quay.io/pypa/manylinux_2_34_x86_64@sha256:e0b7a1bdb4a0b7d519b29b301e2d3c626a33ea78e9bb5bb1590ce2d99d0ae62f
engines:
  llama:
    pins:
      UPSTREAM_REPO: ggml-org/llama.cpp
      UPSTREAM_TAG: b12032
      WHEEL_VERSION: 1.12032.1
      GO_LICENSES_VERSION: v2.0.1
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    cells:
      - cell: windows-x86_64-cpu
        build_number: 4
        backend: cpu
        runner: windows-2022
        asset: llama-b12032-bin-win-cpu-x64.zip
        platform: win_amd64
        license: MIT AND Apache-2.0 WITH LLVM-exception AND LicenseRef-Microsoft-VC-Runtime
        timeout: 45
      - cell: windows-x86_64-cuda
        build_number: 4
        backend: cuda
        runner: windows-2022
        asset: llama-b12032-bin-win-cuda-12.4-x64.zip
        extra_asset: cudart-llama-bin-win-cuda-12.4-x64.zip
        platform: win_amd64
        license: MIT AND LicenseRef-NVIDIA-CUDA-EULA AND Apache-2.0 WITH LLVM-exception AND LicenseRef-Microsoft-VC-Runtime
        timeout: 60
      - cell: macos-arm64-metal
        build_number: 3
        backend: metal
        runner: macos-15
        asset: llama-b12032-bin-macos-arm64.tar.gz
        platform: macosx_14_0_arm64
        license: MIT
        timeout: 45
      - cell: linux-x86_64-cuda
        build_number: 3
        backend: cuda
        runner: ubuntu-22.04
        build: source
        platform: manylinux_2_34_x86_64
        license: MIT AND LicenseRef-NVIDIA-CUDA-EULA
        timeout: 350
      - cell: linux-x86_64-cpu
        build_number: 3
        backend: cpu
        runner: ubuntu-22.04
        build: source
        platform: manylinux_2_34_x86_64
        license: MIT
        timeout: 120
      - cell: windows-x86_64-vulkan
        build_number: 4
        backend: vulkan
        runner: windows-2022
        asset: llama-b12032-bin-win-vulkan-x64.zip
        platform: win_amd64
        license: MIT AND Apache-2.0 WITH LLVM-exception AND LicenseRef-Microsoft-VC-Runtime
        timeout: 45
      - cell: linux-x86_64-vulkan
        build_number: 3
        backend: vulkan
        runner: ubuntu-22.04
        build: source
        platform: manylinux_2_34_x86_64
        license: MIT
        timeout: 120
      - cell: linux-x86_64-rocm
        build_number: 3
        backend: rocm
        runner: ubuntu-22.04
        build: source
        platform: manylinux_2_34_x86_64
        license: MIT AND BSD-3-Clause AND NCSA AND Apache-2.0 WITH LLVM-exception
        timeout: 350
  mistralrs:
    pins:
      MISTRALRS_REPO: EricLBuehler/mistral.rs
      MISTRALRS_TAG: v0.9.5
      MISTRALRS_CHAT_MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
      CARGO_ABOUT_VERSION: 0.9.3
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # The CUDA 12.8 archives of the release: the toolkit of their libraries and the tag of the NCCL in them
      # (libnccl.so.2 reports 2.25.1 built with CUDA 12.8). Upstream builds them with the features
      # "cuda flash-attn nccl" (release.yml of v0.9.5, linux-cuda matrix, cuda_asset "128").
      CUDA_VERSION: 12.8.1
      NCCL_TAG: v2.25.1-1
    cells:
      - cell: mistralrs-linux-x86_64-cpu
        build_number: 2
        backend: cpu
        runner: ubuntu-22.04
        asset: mistralrs-cpu-x86_64-unknown-linux-gnu.tar.gz
        platform: manylinux_2_35_x86_64
        rust_target: x86_64-unknown-linux-gnu
        about_target: x86_64-unknown-linux-musl
        timeout: 60
      - cell: mistralrs-windows-x86_64-cpu
        build_number: 2
        backend: cpu
        runner: windows-2022
        asset: mistralrs-cpu-x86_64-pc-windows-msvc.zip
        platform: win_amd64
        rust_target: x86_64-pc-windows-msvc
        about_target: x86_64-pc-windows-msvc
        timeout: 60
      - cell: mistralrs-macos-arm64-metal
        build_number: 2
        backend: metal
        runner: macos-15
        asset: mistralrs-metal-aarch64-apple-darwin.tar.gz
        # candle makes a residency set, a class of macOS 15, for every Metal device. The Metal libraries in the tool
        # also target macOS 15. The load command of the tool names macOS 11.
        platform: macosx_15_0_arm64
        rust_target: aarch64-apple-darwin
        about_target: aarch64-apple-darwin
        rust_features: metal
        timeout: 45
      - cell: mistralrs-linux-x86_64-cuda-sm80
        build_number: 2
        backend: cuda-sm80
        runner: ubuntu-22.04
        asset: mistralrs-cuda128-sm80-x86_64-unknown-linux-gnu.tar.gz
        platform: manylinux_2_35_x86_64
        rust_target: x86_64-unknown-linux-gnu
        about_target: x86_64-unknown-linux-musl
        rust_features: cuda,flash-attn,nccl
        timeout: 60
      - cell: mistralrs-linux-x86_64-cuda-sm86
        build_number: 2
        backend: cuda-sm86
        runner: ubuntu-22.04
        asset: mistralrs-cuda128-sm86-x86_64-unknown-linux-gnu.tar.gz
        platform: manylinux_2_35_x86_64
        rust_target: x86_64-unknown-linux-gnu
        about_target: x86_64-unknown-linux-musl
        rust_features: cuda,flash-attn,nccl
        timeout: 60
      - cell: mistralrs-linux-x86_64-cuda-sm89
        build_number: 2
        backend: cuda-sm89
        runner: ubuntu-22.04
        asset: mistralrs-cuda128-sm89-x86_64-unknown-linux-gnu.tar.gz
        platform: manylinux_2_35_x86_64
        rust_target: x86_64-unknown-linux-gnu
        about_target: x86_64-unknown-linux-musl
        rust_features: cuda,flash-attn,nccl
        timeout: 60
      - cell: mistralrs-linux-x86_64-cuda-sm90
        build_number: 2
        backend: cuda-sm90
        runner: ubuntu-22.04
        asset: mistralrs-cuda128-sm90-x86_64-unknown-linux-gnu.tar.gz
        platform: manylinux_2_35_x86_64
        rust_target: x86_64-unknown-linux-gnu
        about_target: x86_64-unknown-linux-musl
        rust_features: cuda,flash-attn,nccl
        timeout: 60
      - cell: mistralrs-linux-x86_64-cuda-sm100
        build_number: 2
        backend: cuda-sm100
        runner: ubuntu-22.04
        asset: mistralrs-cuda128-sm100-x86_64-unknown-linux-gnu.tar.gz
        platform: manylinux_2_35_x86_64
        rust_target: x86_64-unknown-linux-gnu
        about_target: x86_64-unknown-linux-musl
        rust_features: cuda,flash-attn,nccl
        timeout: 60
      - cell: mistralrs-linux-x86_64-cuda-sm120
        build_number: 2
        backend: cuda-sm120
        runner: ubuntu-22.04
        asset: mistralrs-cuda128-sm120-x86_64-unknown-linux-gnu.tar.gz
        platform: manylinux_2_35_x86_64
        rust_target: x86_64-unknown-linux-gnu
        about_target: x86_64-unknown-linux-musl
        rust_features: cuda,flash-attn,nccl
        timeout: 60
  tei:
    pins:
      TEI_REPO: https://github.com/huggingface/text-embeddings-inference.git
      TEI_TAG: v1.9.4
      WHEEL_VERSION: 1.9.4
      # The toolchain of rust-toolchain.toml at the tag; the build stops when the two differ.
      RUSTC_VERSION: 1.92.0
      CUDA_VERSION: 12.9.1
      CUDA_PACKAGE_SUFFIX: 12-9
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    cells:
      - cell: tei-linux-x86_64-cpu
        build_number: 1
        os: linux
        backend: cpu
        runner: ubuntu-22.04
        platform: manylinux_2_34_x86_64
        timeout: 120
      - cell: tei-linux-x86_64-cuda-sm75
        build_number: 1
        os: linux
        backend: cuda-sm75
        cc: '75'
        runner: ubuntu-22.04
        platform: manylinux_2_34_x86_64
        timeout: 350
      - cell: tei-linux-x86_64-cuda-sm80
        build_number: 1
        os: linux
        backend: cuda-sm80
        cc: '80'
        runner: ubuntu-22.04
        platform: manylinux_2_34_x86_64
        timeout: 350
      - cell: tei-linux-x86_64-cuda-sm86
        build_number: 1
        os: linux
        backend: cuda-sm86
        cc: '86'
        runner: ubuntu-22.04
        platform: manylinux_2_34_x86_64
        timeout: 350
      - cell: tei-linux-x86_64-cuda-sm89
        build_number: 1
        os: linux
        backend: cuda-sm89
        cc: '89'
        runner: ubuntu-22.04
        platform: manylinux_2_34_x86_64
        timeout: 350
      - cell: tei-linux-x86_64-cuda-sm90
        build_number: 1
        os: linux
        backend: cuda-sm90
        cc: '90'
        runner: ubuntu-22.04
        platform: manylinux_2_34_x86_64
        timeout: 350
      - cell: tei-linux-x86_64-cuda-sm100
        build_number: 1
        os: linux
        backend: cuda-sm100
        cc: '100'
        runner: ubuntu-22.04
        platform: manylinux_2_34_x86_64
        timeout: 350
      - cell: tei-linux-x86_64-cuda-sm120
        build_number: 1
        os: linux
        backend: cuda-sm120
        cc: '120'
        runner: ubuntu-22.04
        platform: manylinux_2_34_x86_64
        timeout: 350
      - cell: tei-macos-arm64-metal
        build_number: 1
        os: macos
        backend: metal
        runner: macos-15
        platform: macosx_14_0_arm64
        timeout: 90
  # The ik_llama.cpp server has no release assets: each cell builds the commit named here.
  # A test in the lilbee repository holds UPSTREAM_COMMIT equal to the commit that the lilbee adapter pins.
  ik:
    pins:
      UPSTREAM_REPO: ikawrakow/ik_llama.cpp
      UPSTREAM_COMMIT: 13cffc006b82e03e4d89cbb8c7327f0255ae3d18
      PLATFORM: manylinux_2_34_x86_64
    cells:
      - cell: linux-x86_64-cpu
        build_number: 4
        backend: cpu
        license: MIT
      - cell: linux-x86_64-cuda
        build_number: 3
        backend: cuda
        license: MIT AND LicenseRef-NVIDIA-CUDA-EULA
  # The other pins of the mlx pack are in engines/mlx.env of the lilbee tree. WHEEL_VERSION is its MLX_LM_VERSION;
  # scripts/pack.sh stops when the recipe writes a wheel of another version.
  mlx:
    pins:
      WHEEL_VERSION: 0.32.2
    cells:
      - cell: macos-arm64-metal
        build_number: 1
        backend: metal
        runner: macos-15
        platform: macosx_14_0_arm64
        license: MIT
        timeout: 45

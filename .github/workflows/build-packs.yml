name: Build and publish engine packs

# Builds the engine wheels (llama.cpp, mistral.rs, text-embeddings-inference, ik_llama.cpp, mlx) from the lilbee
# tree at the lilbee tag in LILBEE_REF, keeps each wheel as a run artifact, and publishes one
# release of this repository for the batch. The release uses the GITHUB_TOKEN of this repository.
# Raise the pin by editing LILBEE_REF to a new lilbee tag. The plan job fails when the tag is missing.
# The publish job never edits a release: a tag that exists, or a wheel name that any release ships, stops the run.
# The matrix of each job comes from cells.yml through scripts/plan.sh. Edit a cell or a build number there.
# The plan drops each cell whose wheel a release ships, so "all" builds only the cells that are not published.
# lilbee's own install checks gate the run: the plan screens the licence that each cell declares, and the
# publish job checks each wheel before the release. Both run tools/check_pack_licences.py of the lilbee tag.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: The engine to build.
        type: choice
        options: [all, llama, mistralrs, tei, ik, mlx]
        default: all
      tag_suffix:
        description: Optional text after the date in the release tag, such as tei or llama-gpu.
        type: string
        default: ""
      publish:
        description: Publish a release when every build passes.
        type: boolean
        default: true
      prerelease:
        description: Create the release as a prerelease.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Each build job runs when the plan gives it cells. The plan is the one switch: "all" selects every engine
  # of cells.yml, a name selects one engine, and a published cell is dropped.
  plan:
    name: Plan the cells and pick the lilbee commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      lilbee_ref: ${{ steps.pin.outputs.ref }}
      lilbee_tag: ${{ steps.pin.outputs.tag }}
      lilbee_commit: ${{ steps.pin.outputs.commit }}
      llama: ${{ steps.plan.outputs.llama }}
      mistralrs: ${{ steps.plan.outputs.mistralrs }}
      tei: ${{ steps.plan.outputs.tei }}
      ik: ${{ steps.plan.outputs.ik }}
      mlx: ${{ steps.plan.outputs.mlx }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: bash scripts/lilbee_ref.sh >> "$GITHUB_OUTPUT"
      - name: List the published wheels
        run: bash scripts/published.sh > published.txt
      # Each job reads its matrix from cells.yml through scripts/plan.sh. An engine that the run does not select gets [].
      - id: plan
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          bash scripts/plan.sh "${ENGINE}" "" cells.yml published.txt > plan.json
          jq -r 'to_entries[] | "\(.key)=\(.value | tojson)"' plan.json >> "$GITHUB_OUTPUT"
          echo "any=$(jq 'any(.[]; length > 0)' plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ steps.pin.outputs.ref }}
          path: lilbee
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      # A cell whose declared licence lilbee would refuse fails the run before any build starts.
      - name: Screen the licence of each planned cell
        run: uv run --project lilbee --locked --no-dev python lilbee/tools/check_pack_licences.py terms plan.json

  cell:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.llama != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.llama) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      LILBEE_DIR: lilbee
      CELL: llama-${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - name: Free disk space for the Vulkan and ROCm build
        if: matrix.build == 'source' && matrix.backend != 'cuda'
        run: |
          set -euo pipefail
          # The ROCm packages and the build need more disk than the runner image leaves free.
          # This runs before setup-go and setup-python, so the later tool installs survive it.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h / | tail -1

      - name: Free disk space for the CUDA build
        if: matrix.build == 'source' && matrix.backend == 'cuda'
        run: |
          set -euo pipefail
          # The runner disk is small; the build and the toolkit need several GB.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Read the Go version
        id: go
        run: |
          set -euo pipefail
          sed -n 's/^ENGINE_GO_VERSION=/version=/p' lilbee/engine-versions.env >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Windows runner image has no yq.
      - name: Install the pinned yq
        if: runner.os == 'Windows'
        run: |
          bash scripts/install_yq.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: llama-pack-${{ matrix.cell }}
          path: dist/llama-${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  mistralrs:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.mistralrs != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mistralrs) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      LILBEE_DIR: lilbee
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Windows runner image has no yq.
      - name: Install the pinned yq
        if: runner.os == 'Windows'
        run: |
          bash scripts/install_yq.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Free disk space for the CUDA archive
        if: startsWith(matrix.backend, 'cuda-')
        run: |
          set -euo pipefail
          # The CUDA archive, its five libraries, the unpacked tree and the wheel need several GB.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h / | tail -1

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: engine-pack-${{ matrix.cell }}
          path: dist/${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  tei:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.tei != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tei) }}
    defaults:
      run:
        shell: bash
    env:
      LILBEE_DIR: lilbee
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Free disk space for the CUDA build
        if: matrix.cc != ''
        run: |
          set -euo pipefail
          # The toolkit and the flash attention kernels need several GB beside the build tree.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      # The pack starts the router of a Linux cell on an emulated CPU.
      - name: Install the CPU emulator
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y qemu-user-static

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: tei-pack-${{ matrix.cell }}
          path: dist/${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  ik:
    name: ik-${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.ik != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ik) }}
    defaults:
      run:
        shell: bash
    env:
      LILBEE_DIR: lilbee
      CELL: ik-${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - name: Free disk space for the build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h / | tail -1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: ik-pack-${{ matrix.cell }}
          path: dist/ik-${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  mlx:
    name: mlx-${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.mlx != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mlx) }}
    defaults:
      run:
        shell: bash
    env:
      LILBEE_DIR: lilbee
      CELL: mlx-${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: mlx-pack-${{ matrix.cell }}
          path: dist/mlx-${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [plan, cell, mistralrs, tei, ik, mlx]
    # The job runs after skipped build jobs (an engine with no planned cell). The first step then fails on any
    # cancelled or failed job, which a job condition cannot test without also blocking on the skipped ones.
    # A plan with no cell, where every selected cell is published, publishes nothing.
    if: ${{ inputs.publish && !cancelled() && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SUFFIX: ${{ inputs.tag_suffix }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every build job to have succeeded
        run: bash scripts/needs_ok.sh "${NEEDS}"
        env:
          NEEDS: ${{ toJSON(needs) }}
      - uses: actions/download-artifact@v8
        with:
          path: packs
          pattern: "*-pack-*"
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      # The release ships only wheels that lilbee engine install accepts. A refusal stops the job before any write.
      - name: Check each wheel as lilbee engine install does
        run: uv run --project lilbee --locked --no-dev python lilbee/tools/check_pack_licences.py wheels packs

      - name: Create the release and upload the wheels
        run: bash scripts/publish.sh packs "${SUFFIX}" "${LILBEE_TAG}" "${LILBEE_COMMIT}"
        env:
          LILBEE_TAG: ${{ needs.plan.outputs.lilbee_tag }}
          LILBEE_COMMIT: ${{ needs.plan.outputs.lilbee_commit }}

name: Build and publish engine packs

# Builds the engine wheels (llama.cpp, mistral.rs, text-embeddings-inference, ik_llama.cpp) from the lilbee
# tree at the lilbee tag in LILBEE_REF, keeps each wheel as a run artifact, and publishes one
# release of this repository for the batch. The release uses the GITHUB_TOKEN of this repository.
# Raise the pin by editing LILBEE_REF to a new lilbee tag. The plan job fails when the tag is missing.
# The publish job never edits a release: a tag that exists, or a wheel name that any release ships, stops the run.
# The matrix of each job comes from cells.yml through scripts/plan.sh. Edit a cell or a build number there.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: The engine to build.
        type: choice
        options: [all, llama, mistralrs, tei, ik]
        default: all
      tag_suffix:
        description: Optional text after the date in the release tag, such as tei or llama-gpu.
        type: string
        default: ""
      publish:
        description: Publish a release when every build passes.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The llama and mistralrs jobs run when needs.plan.outputs.engine is "all" or their own name.
  # The tei and ik jobs run only when it is their own name: "all" does not start them.
  plan:
    name: Pick the engine and the lilbee commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ inputs.engine }}
      lilbee_ref: ${{ steps.pin.outputs.ref }}
      lilbee_tag: ${{ steps.pin.outputs.tag }}
      lilbee_commit: ${{ steps.pin.outputs.commit }}
      llama: ${{ steps.plan.outputs.llama }}
      mistralrs: ${{ steps.plan.outputs.mistralrs }}
      tei: ${{ steps.plan.outputs.tei }}
      ik: ${{ steps.plan.outputs.ik }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: bash scripts/lilbee_ref.sh >> "$GITHUB_OUTPUT"
      # Each job reads its matrix from cells.yml through scripts/plan.sh. An engine that the run does not select gets [].
      - id: plan
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          plan="$(bash scripts/plan.sh "${ENGINE}")"
          for engine in llama mistralrs tei ik; do
            echo "${engine}=$(jq -c ".${engine}" <<< "${plan}")"
          done >> "$GITHUB_OUTPUT"

  cell:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.engine == 'all' || needs.plan.outputs.engine == 'llama'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.llama) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      LILBEE_DIR: lilbee
      CELL: llama-${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - name: Free disk space for the Vulkan and ROCm build
        if: matrix.build == 'source' && matrix.backend != 'cuda'
        run: |
          set -euo pipefail
          # The ROCm packages and the build need more disk than the runner image leaves free.
          # This runs before setup-go and setup-python, so the later tool installs survive it.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h / | tail -1

      - name: Free disk space for the CUDA build
        if: matrix.build == 'source' && matrix.backend == 'cuda'
        run: |
          set -euo pipefail
          # The runner disk is small; the build and the toolkit need several GB.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Read the Go version
        id: go
        run: |
          set -euo pipefail
          sed -n 's/^ENGINE_GO_VERSION=/version=/p' lilbee/engine-versions.env >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Windows runner image has no yq.
      - name: Install the pinned yq
        if: runner.os == 'Windows'
        run: |
          bash scripts/install_yq.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Build the pack
        run: bash scripts/pack.sh "${CELL}"

      # The check reads out/, license-expression.txt, cuda-libs.sha256 and vs-licence.docx of the lilbee checkout.
      - name: Start llama-server from the installed wheel
        working-directory: lilbee
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          LICENSE_EXPRESSION="$(cat license-expression.txt)"
          python -m venv check-venv
          if [ "${RUNNER_OS}" = Windows ]; then py=check-venv/Scripts/python.exe; else py=check-venv/bin/python; fi
          "${py}" -m pip install -q out/*.whl
          exe="$("${py}" -c "import lilbee_engine_llama_cpp as m; print(m.get_llama_server_path().as_posix())")"
          echo "llama-server: ${exe}"
          bindir="$(dirname "${exe}")"
          ls "${bindir}"
          for tool in llama-swap gguf-parser; do
            test -e "${bindir}/${tool}" -o -e "${bindir}/${tool}.exe" || { echo "wheel lacks ${tool}"; exit 1; }
          done
          if [ "${RUNNER_OS}" = Windows ]; then
            for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
              test -f "${bindir}/${dll}" || { echo "wheel lacks ${dll}"; exit 1; }
            done
          fi
          python -m zipfile -l out/*.whl | grep -E 'dist-info/(licenses/|METADATA)'
          unzip -p out/*.whl '*.dist-info/METADATA' | grep -x "License-Expression: ${LICENSE_EXPRESSION}"
          # The listing goes to a file: grep -q stops at its first match, and a pipe from unzip then fails with SIGPIPE under pipefail on a long listing.
          unzip -l out/*.whl > wheel-listing.txt
          for lic in llama.cpp llama-swap gguf-parser; do
            grep -q "dist-info/licenses/LICENSE-${lic}$" wheel-listing.txt || { echo "wheel lacks the ${lic} licence"; exit 1; }
          done
          for third in llama-swap gguf-parser llama.cpp; do
            grep -q "dist-info/licenses/THIRD-PARTY/${third}/" wheel-listing.txt || { echo "wheel lacks the ${third} third-party licences"; exit 1; }
          done
          grep -q "dist-info/licenses/LICENSE-Go$" wheel-listing.txt || { echo "wheel lacks the Go library licence"; exit 1; }
          if [ "${RUNNER_OS}" = Windows ]; then
            grep -q "dist-info/licenses/NOTICE-MICROSOFT-VC-RUNTIME$" wheel-listing.txt || { echo "wheel lacks the Visual C++ runtime notice"; exit 1; }
            python -I tools/wheel-build/vs_distributable_terms.py --verify vs-licence.docx out/*.whl
          fi
          if [ -f "${bindir}/libomp.dll" ]; then
            grep -q "dist-info/licenses/LICENSE-LLVM-OpenMP$" wheel-listing.txt || { echo "wheel lacks the LLVM OpenMP licence"; exit 1; }
          fi
          if [ "${BACKEND}" = cpu ] && [ "${RUNNER_OS}" = Linux ]; then
            test "$(find "${bindir}" -name 'libggml-cpu-*.so' | wc -l)" -ge 2
            if ldd "${bindir}/llama-server" | grep 'not found'; then echo "llama-server has an unresolved library"; exit 1; fi
            bash "${GITHUB_WORKSPACE}/lilbee/tools/wheel-build/check_glibc_floor.sh" "${bindir}"
          fi
          if [ "${BACKEND}" = vulkan ]; then
            if [ "${RUNNER_OS}" = Windows ]; then
              test -f "${bindir}/ggml-vulkan.dll"
            else
              test -f "${bindir}/libggml-vulkan.so"
              test "$(find "${bindir}" -name 'libggml-cpu-*.so' | wc -l)" -ge 2
              if find "${bindir}" -name 'libvulkan*' | grep .; then echo "the Vulkan loader must stay with the host"; exit 1; fi
              if ldd "${bindir}/llama-server" | grep 'not found'; then echo "llama-server has an unresolved library"; exit 1; fi
              bash "${GITHUB_WORKSPACE}/lilbee/tools/wheel-build/check_glibc_floor.sh" "${bindir}"
            fi
          fi
          if [ "${BACKEND}" = rocm ]; then
            test -f "${bindir}/libggml-hip.so"
            test -d "${bindir}/rocblas/library"
            test "$(find "${bindir}" -name 'libggml-cpu-*.so' | wc -l)" -ge 2
            for lic in hsa-rocr comgr hip-runtime-amd rocblas hipblas hipblaslt rocm-llvm roctracer rocprofiler-register; do
              grep -q "dist-info/licenses/LICENSE-ROCm-${lic}$" wheel-listing.txt || { echo "wheel lacks the ${lic} licence"; exit 1; }
            done
            if ldd "${bindir}/llama-server" | grep 'not found'; then echo "llama-server has an unresolved library"; exit 1; fi
            bash "${GITHUB_WORKSPACE}/lilbee/tools/wheel-build/check_glibc_floor.sh" "${bindir}"
            # A clean container names exactly the six host libraries; with them installed, everything resolves.
            bash "${GITHUB_WORKSPACE}/lilbee/tools/qa/assert_rocm_host_libs.sh" "${bindir}"
            bash "${GITHUB_WORKSPACE}/lilbee/tools/qa/assert_rocm_bundle_loads.sh" "${bindir}"
          fi
          if [ "${BACKEND}" = cuda ]; then
            grep -q "dist-info/licenses/NOTICE-NVIDIA-CUDA$" wheel-listing.txt || { echo "wheel lacks the NVIDIA notice"; exit 1; }
            grep -q "dist-info/licenses/THIRD-PARTY/llama.cpp/_deps/cccl/LICENSE$" wheel-listing.txt || { echo "wheel lacks the CCCL licence"; exit 1; }
            if [ "${RUNNER_OS}" = Windows ]; then
              for dll in ggml-cuda.dll cudart64_12.dll cublas64_12.dll cublasLt64_12.dll; do
                test -f "${bindir}/${dll}" || { echo "wheel lacks ${dll}"; exit 1; }
              done
            else
              # The NVIDIA files must match the toolkit's files byte for byte (EULA 2.3).
              (cd "${bindir}" && sha256sum -c "${OLDPWD}/cuda-libs.sha256")
              test -f "${bindir}/libggml-cuda.so"
              test "$(find "${bindir}" -name 'libggml-cpu-*.so' | wc -l)" -ge 2
              if ldd "${bindir}/llama-server" | grep 'not found'; then echo "llama-server has an unresolved library"; exit 1; fi
            fi
          fi
          if [ "${RUNNER_OS}" = macOS ]; then
            # Every library that a binary loads by @rpath or @loader_path must be a file beside it.
            missing=0
            for f in "${bindir}"/*; do
              file "${f}" | grep -q 'Mach-O' || continue
              for name in $(otool -L "${f}" | awk 'NR > 1 && $1 ~ /^@(rpath|loader_path)\// {n = split($1, a, "/"); print a[n]}'); do
                test -f "${bindir}/${name}" || { echo "${f##*/} loads ${name}: missing"; missing=1; }
              done
            done
            test "${missing}" -eq 0
            find "${bindir}" -type l | grep . && { echo "unexpected symlink"; exit 1; }
            du -sk "${bindir}"
          fi
          cd /
          "${exe}" --version
          case "${BACKEND}" in cuda | vulkan | rocm) "${exe}" --list-devices ;; esac

      - uses: actions/upload-artifact@v7
        with:
          name: llama-pack-${{ matrix.cell }}
          path: dist/llama-${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  mistralrs:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.engine == 'all' || needs.plan.outputs.engine == 'mistralrs'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mistralrs) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      LILBEE_DIR: lilbee
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Windows runner image has no yq.
      - name: Install the pinned yq
        if: runner.os == 'Windows'
        run: |
          bash scripts/install_yq.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: engine-pack-${{ matrix.cell }}
          path: dist/${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  tei:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.engine == 'tei'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tei) }}
    defaults:
      run:
        shell: bash
    env:
      LILBEE_DIR: lilbee
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Free disk space for the CUDA build
        if: matrix.cc != ''
        run: |
          set -euo pipefail
          # The toolkit and the flash attention kernels need several GB beside the build tree.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      # The pack starts the router of a Linux cell on an emulated CPU.
      - name: Install the CPU emulator
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y qemu-user-static

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: tei-pack-${{ matrix.cell }}
          path: dist/${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  ik:
    name: ik-${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.engine == 'ik'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ik) }}
    defaults:
      run:
        shell: bash
    env:
      LILBEE_DIR: lilbee
      CELL: ik-${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - name: Free disk space for the build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h / | tail -1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: ik-pack-${{ matrix.cell }}
          path: dist/ik-${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [plan, cell, mistralrs, tei, ik]
    if: ${{ inputs.publish && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SUFFIX: ${{ inputs.tag_suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: packs
          pattern: "*-pack-*"
          merge-multiple: true

      - name: Create the release and upload the wheels
        run: bash scripts/publish.sh packs "${SUFFIX}" "${LILBEE_TAG}" "${LILBEE_COMMIT}"
        env:
          LILBEE_TAG: ${{ needs.plan.outputs.lilbee_tag }}
          LILBEE_COMMIT: ${{ needs.plan.outputs.lilbee_commit }}

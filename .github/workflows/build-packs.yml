name: Build and publish engine packs

# Builds the engine wheels (llama.cpp, mistral.rs, text-embeddings-inference, ik_llama.cpp) from the lilbee
# tree at the lilbee tag in LILBEE_REF, keeps each wheel as a run artifact, and publishes one
# release of this repository for the batch. The release uses the GITHUB_TOKEN of this repository.
# Raise the pin by editing LILBEE_REF to a new lilbee tag. The plan job fails when the tag is missing.
# The publish job never edits a release: a tag that exists, or a wheel name that any release ships, stops the run.
# The matrix of each job comes from cells.yml through scripts/plan.sh. Edit a cell or a build number there.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: The engine to build.
        type: choice
        options: [all, llama, mistralrs, tei, ik]
        default: all
      tag_suffix:
        description: Optional text after the date in the release tag, such as tei or llama-gpu.
        type: string
        default: ""
      publish:
        description: Publish a release when every build passes.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The llama and mistralrs jobs run when needs.plan.outputs.engine is "all" or their own name.
  # The tei and ik jobs run only when it is their own name: "all" does not start them.
  plan:
    name: Pick the engine and the lilbee commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ inputs.engine }}
      lilbee_ref: ${{ steps.pin.outputs.ref }}
      lilbee_tag: ${{ steps.pin.outputs.tag }}
      lilbee_commit: ${{ steps.pin.outputs.commit }}
      llama: ${{ steps.plan.outputs.llama }}
      mistralrs: ${{ steps.plan.outputs.mistralrs }}
      tei: ${{ steps.plan.outputs.tei }}
      ik: ${{ steps.plan.outputs.ik }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: bash scripts/lilbee_ref.sh >> "$GITHUB_OUTPUT"
      # Each job reads its matrix from cells.yml through scripts/plan.sh. An engine that the run does not select gets [].
      - id: plan
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          plan="$(bash scripts/plan.sh "${ENGINE}")"
          for engine in llama mistralrs tei ik; do
            echo "${engine}=$(jq -c ".${engine}" <<< "${plan}")"
          done >> "$GITHUB_OUTPUT"

  cell:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.engine == 'all' || needs.plan.outputs.engine == 'llama'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.llama) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      LILBEE_DIR: lilbee
      CELL: llama-${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - name: Free disk space for the Vulkan and ROCm build
        if: matrix.build == 'source' && matrix.backend != 'cuda'
        run: |
          set -euo pipefail
          # The ROCm packages and the build need more disk than the runner image leaves free.
          # This runs before setup-go and setup-python, so the later tool installs survive it.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h / | tail -1

      - name: Free disk space for the CUDA build
        if: matrix.build == 'source' && matrix.backend == 'cuda'
        run: |
          set -euo pipefail
          # The runner disk is small; the build and the toolkit need several GB.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      - name: Read the Go version
        id: go
        run: |
          set -euo pipefail
          sed -n 's/^ENGINE_GO_VERSION=/version=/p' lilbee/engine-versions.env >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Windows runner image has no yq.
      - name: Install the pinned yq
        if: runner.os == 'Windows'
        run: |
          bash scripts/install_yq.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: llama-pack-${{ matrix.cell }}
          path: dist/llama-${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  mistralrs:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.engine == 'all' || needs.plan.outputs.engine == 'mistralrs'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mistralrs) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      LILBEE_DIR: lilbee
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The Windows runner image has no yq.
      - name: Install the pinned yq
        if: runner.os == 'Windows'
        run: |
          bash scripts/install_yq.sh "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: engine-pack-${{ matrix.cell }}
          path: dist/${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  tei:
    name: ${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.engine == 'tei'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tei) }}
    defaults:
      run:
        shell: bash
    env:
      LILBEE_DIR: lilbee
      CELL: ${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Free disk space for the CUDA build
        if: matrix.cc != ''
        run: |
          set -euo pipefail
          # The toolkit and the flash attention kernels need several GB beside the build tree.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      # The pack starts the router of a Linux cell on an emulated CPU.
      - name: Install the CPU emulator
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y qemu-user-static

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: tei-pack-${{ matrix.cell }}
          path: dist/${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  ik:
    name: ik-${{ matrix.cell }}
    needs: plan
    if: needs.plan.outputs.engine == 'ik'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ik) }}
    defaults:
      run:
        shell: bash
    env:
      LILBEE_DIR: lilbee
      CELL: ik-${{ matrix.cell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ needs.plan.outputs.lilbee_ref }}
          path: lilbee

      - name: Free disk space for the build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h / | tail -1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and check the pack
        run: bash scripts/pack.sh "${CELL}"

      - uses: actions/upload-artifact@v7
        with:
          name: ik-pack-${{ matrix.cell }}
          path: dist/ik-${{ matrix.cell }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [plan, cell, mistralrs, tei, ik]
    if: ${{ inputs.publish && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SUFFIX: ${{ inputs.tag_suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: packs
          pattern: "*-pack-*"
          merge-multiple: true

      - name: Create the release and upload the wheels
        run: bash scripts/publish.sh packs "${SUFFIX}" "${LILBEE_TAG}" "${LILBEE_COMMIT}"
        env:
          LILBEE_TAG: ${{ needs.plan.outputs.lilbee_tag }}
          LILBEE_COMMIT: ${{ needs.plan.outputs.lilbee_commit }}

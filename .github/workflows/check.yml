name: Check the pack build

# Runs the lilbee tests that read the build workflow of this repository.
# The tests come from the lilbee tag in LILBEE_REF. The tag must hold tests/_pack_workflow.py.
# The tests read build-packs.yml of this checkout through ENGINE_PACKS_WORKFLOW.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-tests:
    name: Workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: packs

      - name: Read the pin
        id: pin
        run: echo "ref=refs/tags/$(tr -d '[:space:]' < packs/LILBEE_REF)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: tobocop2/lilbee
          ref: ${{ steps.pin.outputs.ref }}
          path: lilbee

      - name: Require the tests that read this workflow
        run: |
          test -f lilbee/tests/_pack_workflow.py || { echo "::error::The lilbee tag in LILBEE_REF has no tests/_pack_workflow.py. The tests would read the old in-tree workflow. Name a newer tag."; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install lilbee
        working-directory: lilbee
        run: uv sync --locked

      - name: Run the tests
        working-directory: lilbee
        env:
          ENGINE_PACKS_WORKFLOW: ${{ github.workspace }}/packs/.github/workflows/build-packs.yml
        run: >-
          uv run pytest -p no:cacheprovider -q
          tests/test_llama_pack_backend.py
          tests/test_mistralrs_pack_tools.py
          tests/test_tei_wheel_tools.py
          tests/providers/fleet/test_engine_store.py
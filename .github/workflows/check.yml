name: Check the pack build

# Runs `make check`: the shell lint, the bats tests of the scripts, and the lilbee tests at
# the tag in LILBEE_REF. The lilbee tests read cells.yml and build-packs.yml of this checkout.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The runner image ships older shellcheck and actionlint. The Makefile requires the pinned versions.
      - name: Install the pinned lint tools
        run: |
          bash scripts/install_lint_tools.sh "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y bats

      - name: Run the checks
        run: make check
